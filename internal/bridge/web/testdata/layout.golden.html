<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Painel administrativo da ponte entre Chatwoot e megaAPI para mensagens de WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='oklch(63%25%200.18%20250)'/%3E%3C/svg%3E">
<title>Painel — Bridge Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
:root {
  --bg-app: oklch(99% 0.002 264);
  --bg-sidebar: oklch(96% 0.003 264);
  --bg-input: oklch(0% 0 0 / 0.04);
  --bg-elev: oklch(100% 0 0);
  --bg-hover: oklch(94% 0.004 264);

  --fg-strong: oklch(22% 0.01 264);
  --fg-default: oklch(48% 0.01 264);
  --fg-muted: oklch(65% 0.008 264);
  --fg-on-accent: oklch(99% 0.002 264);

  --border-subtle: oklch(92% 0.004 264);
  --border-strong: oklch(85% 0.006 264);

  --accent: oklch(63% 0.18 250);
  --accent-hover: oklch(58% 0.18 250);
  --accent-soft: oklch(95% 0.04 250);

  --success: oklch(60% 0.15 145);
  --warning: oklch(75% 0.16 85);
  --danger: oklch(58% 0.20 25);

  --font-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --text-xl: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 320ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in: cubic-bezier(0.64, 0, 0.78, 0);
}

html, body {
  background: var(--bg-app);
  color: var(--fg-default);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 20px;
  margin: 0;
  padding: 0;
}

.bridge-shell {
  min-height: 100vh;
}

.bridge-shell--with-aside {
  display: grid;
  grid-template-columns: 1fr;
}

@media (min-width: 1024px) {
  .bridge-shell--with-aside {
    grid-template-columns: 240px 1fr;
  }
}

.bridge-main {
  padding: var(--space-6) var(--space-4);
}

@media (min-width: 640px) {
  .bridge-main {
    padding: var(--space-6) var(--space-8);
  }
}

.bridge-mobile-bar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-app);
}

@media (min-width: 1024px) {
  .bridge-mobile-bar { display: none; }
}

.bridge-hamburger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-elev);
  color: var(--fg-strong);
  cursor: pointer;
}

.bridge-mobile-bar__title {
  font-size: 15px;
  font-weight: 500;
  color: var(--fg-strong);
}

.bridge-sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: var(--space-5) var(--space-4);
  gap: var(--space-6);
  position: fixed;
  inset: 0 auto 0 0;
  width: 240px;
  transform: translateX(-100%);
  transition: transform var(--dur-base) var(--ease-out);
  z-index: 30;
}

.bridge-sidebar.is-open {
  transform: translateX(0);
}

@media (min-width: 1024px) {
  .bridge-sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    transform: none;
  }
}

.bridge-sidebar__brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.bridge-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--fg-strong);
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
}

.bridge-brand__mark {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  display: inline-block;
}

.bridge-sidebar__close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--fg-default);
  cursor: pointer;
  border-radius: var(--radius-md);
}

.bridge-sidebar__close:hover { background: var(--bg-hover); }

@media (min-width: 1024px) {
  .bridge-sidebar__close { display: none; }
}

.bridge-nav {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  flex: 1;
}

.bridge-nav__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 6px var(--space-3);
  border-radius: var(--radius-md);
  color: var(--fg-strong);
  font-size: 14px;
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}

.bridge-nav__item:hover { background: var(--bg-hover); }

.bridge-nav__item[aria-current=page] {
  background: var(--bg-elev);
  color: var(--fg-strong);
  font-weight: 500;
  border: 1px solid var(--border-subtle);
}

.bridge-sidebar__user {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.bridge-user {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.bridge-user__avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  background: var(--accent-soft);
  display: inline-block;
}

.bridge-user__email {
  font-size: 13px;
  color: var(--fg-default);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bridge-user__logout {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 6px var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-elev);
  color: var(--fg-default);
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  justify-content: flex-start;
}

.bridge-user__logout:hover {
  background: var(--bg-hover);
  color: var(--fg-strong);
}

.bridge-backdrop {
  position: fixed;
  inset: 0;
  background: oklch(22% 0.01 264 / 0.32);
  z-index: 20;
  display: none;
}

.bridge-backdrop.is-open { display: block; }

@media (min-width: 1024px) {
  .bridge-backdrop { display: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0ms !important;
    animation-duration: 0ms !important;
  }
}

body { font-size: 16px; line-height: 22px; }

.input {
  display: block;
  width: 100%;
  margin-top: var(--space-1);
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--bg-elev);
  color: var(--fg-strong);
  font: inherit;
  font-size: 15px;
}
.input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 10px 16px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font: inherit;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.btn-primary {
  background: var(--accent);
  color: var(--fg-on-accent);
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost {
  background: transparent;
  color: var(--fg-strong);
  border-color: var(--border-strong);
}
.btn-ghost:hover { background: var(--bg-hover); }
.btn-danger {
  background: var(--danger);
  color: var(--fg-on-accent);
  border-color: var(--danger);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid transparent;
}
.badge-success { background: color-mix(in oklch, var(--success) 12%, var(--bg-elev)); color: var(--success); border-color: color-mix(in oklch, var(--success) 28%, transparent); }
.badge-warning { background: color-mix(in oklch, var(--warning) 18%, var(--bg-elev)); color: color-mix(in oklch, var(--warning) 70%, var(--fg-strong)); border-color: color-mix(in oklch, var(--warning) 30%, transparent); }
.badge-danger { background: color-mix(in oklch, var(--danger) 12%, var(--bg-elev)); color: var(--danger); border-color: color-mix(in oklch, var(--danger) 28%, transparent); }
.badge-neutral { background: var(--bg-hover); color: var(--fg-default); border-color: var(--border-subtle); }

.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-elev);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  font-size: 14px;
}
.data-table th, .data-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--fg-strong);
}
.data-table th {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-muted);
  background: var(--bg-sidebar);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--bg-hover); }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.error-text { color: var(--danger); font-size: 12px; }

.list-item {
  display: none;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  background: var(--bg-elev);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-3);
}
@media (max-width: 767px) {
  .data-table { display: none; }
  .list-item { display: flex; }
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-10) var(--space-4);
  text-align: center;
  background: var(--bg-elev);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  color: var(--fg-default);
}
.empty-state__icon { color: var(--fg-muted); }
.empty-state__title { font-size: 18px; font-weight: 600; color: var(--fg-strong); }
.empty-state__body { color: var(--fg-default); max-width: 40ch; }

.alert {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: 10px 12px;
  border-radius: var(--radius-md);
  font-size: 14px;
  background: color-mix(in oklch, var(--danger) 10%, var(--bg-elev));
  color: var(--danger);
  border: 1px solid color-mix(in oklch, var(--danger) 25%, transparent);
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.section-header h1 { font-size: var(--text-xl); font-weight: 600; color: var(--fg-strong); margin: 0; }

@media (max-width: 639px) {
  .bridge-main { padding: var(--space-4); }
  .section-header { flex-direction: column; align-items: stretch; }
}

.field__label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-strong);
  margin-bottom: var(--space-1);
}
.field__hint {
  display: block;
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: var(--space-1);
}

.stepper {
  display: flex;
  flex-direction: column;
  gap: 0;
  width: 200px;
  flex-shrink: 0;
}
.step {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  color: var(--fg-muted);
  font-size: 13px;
}
.step + .step::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 11px;
  width: 2px;
  height: calc(100% - 6px);
  background: var(--border-subtle);
}
.step-bullet {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  color: var(--fg-muted);
  flex-shrink: 0;
  z-index: 1;
}
.step-label { line-height: 1.3; }
.step[data-state="active"] { color: var(--fg-strong); font-weight: 500; }
.step[data-state="active"] .step-bullet { background: var(--accent); border-color: var(--accent); color: var(--fg-on-accent); }
.step[data-state="completed"] { color: var(--fg-default); }
.step[data-state="completed"] .step-bullet { background: var(--success); border-color: var(--success); color: var(--fg-on-accent); }

.wizard-shell {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
@media (min-width: 768px) {
  .wizard-shell { flex-direction: row; align-items: flex-start; }
}

.toast-floating {
  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}
.toast-floating > .toast { pointer-events: auto; }
.toast--enter { transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }

a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: var(--space-4);
  top: -64px;
  z-index: 60;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--fg-strong);
  font-size: 14px;
  text-decoration: none;
  transition: top var(--dur-fast) var(--ease-out);
}
.skip-link:focus { top: var(--space-4); }

.skeleton {
  background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-input) 37%, var(--bg-hover) 63%);
  background-size: 400% 100%;
  animation: skeleton-shimmer 1.4s var(--ease-out) infinite;
  border-radius: var(--radius-sm);
}
.skeleton-row {
  height: 16px;
  width: 100%;
  margin-bottom: var(--space-3);
}
@keyframes skeleton-shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

.bridge-toasts {
  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 50;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 10px 14px;
  max-width: 360px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-elev);
  color: var(--fg-strong);
  font-size: 14px;
  pointer-events: auto;
  box-shadow: 0 4px 12px oklch(22% 0.01 264 / 0.16);
}
.toast-success { border-color: color-mix(in oklch, var(--success) 40%, transparent); }
.toast-danger { border-color: color-mix(in oklch, var(--danger) 40%, transparent); color: var(--danger); }
.toast__close {
  margin-left: auto;
  background: transparent;
  border: none;
  color: var(--fg-muted);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.toast__close:hover { color: var(--fg-strong); }

@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; }
  .skip-link { transition: none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para conteúdo</a>

<div class="bridge-shell bridge-shell--with-aside"
     x-data="{open:false, gPending:false}"
     @keydown.window="
       if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
       if ($event.key === 'g') { gPending = true; setTimeout(() => gPending = false, 1200); return; }
       if (!gPending) return;
       gPending = false;
       const dest = {d:'/', m:'/messages', q:'/dlq', s:'/settings'}[$event.key];
       if (dest) window.location.href = dest;
     ">
  <div class="bridge-mobile-bar">
    <button type="button" class="bridge-hamburger" @click="open=true" aria-label="Abrir menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="bridge-mobile-bar__title">Painel</span>
  </div>
  
<aside id="sidebar" class="bridge-sidebar"
       :class="open ? 'is-open' : ''"
       x-data="{open:false}">
  <div class="bridge-sidebar__brand">
    <a href="/" class="bridge-brand">
      <span class="bridge-brand__mark" aria-hidden="true"></span>
      <span class="bridge-brand__name">Bridge Admin</span>
    </a>
    <button type="button" class="bridge-sidebar__close"
            @click="open=false" aria-label="Fechar menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6l-12 12"/></svg>
    </button>
  </div>
  <nav class="bridge-nav" aria-label="Navegação principal">
    
    <a href="/" class="bridge-nav__item" title="Atalho: g d" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9v11h14V9"/></svg>
      <span>Painel</span>
    </a>
    <a href="/tenants/new" class="bridge-nav__item" >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2M19 8v6M16 11h6"/></svg>
      <span>Tenants</span>
    </a>
    <a href="/messages" class="bridge-nav__item" title="Atalho: g m" >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h16v11H7l-3 3z"/></svg>
      <span>Mensagens</span>
    </a>
    <a href="/dlq" class="bridge-nav__item" title="Atalho: g q" >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>
      <span>DLQ</span>
    </a>
    <a href="/settings" class="bridge-nav__item" title="Atalho: g s" >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2l-.3-2.5h-4l-.3 2.5a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 002 1.2l.3 2.5h4l.3-2.5a7 7 0 002-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      <span>Configurações</span>
    </a>
  </nav>
  <div class="bridge-sidebar__user">
    <div class="bridge-user">
      <span class="bridge-user__avatar" aria-hidden="true"></span>
      <span class="bridge-user__email">admin@example.com</span>
    </div>
    <form method="post" action="/logout">
      <button type="submit" class="bridge-user__logout" aria-label="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 12H4M11 8l-4 4 4 4M14 4h5v16h-5"/></svg>
        <span>Sair</span>
      </button>
    </form>
  </div>
</aside>

  <div class="bridge-backdrop" :class="open ? 'is-open' : ''" @click="open=false"></div>
  <main id="conteudo" class="bridge-main">
<div data-test="content"></div>
  </main>
  <div class="bridge-toasts" aria-live="polite" aria-atomic="false"
       x-data="{items:[], seq:0}"
       @toast.window="
         const id = ++seq;
         items.push({id, msg: ($event.detail && ($event.detail.msg || $event.detail.message)) || '', variant: ($event.detail && $event.detail.variant) || 'success'});
         setTimeout(() => { items = items.filter(i => i.id !== id); }, 4000);
       ">
    <template x-for="t in items" :key="t.id">
      <div class="toast" :class="'toast-' + t.variant" role="status">
        <span x-text="t.msg"></span>
        <button type="button" class="toast__close" @click="items = items.filter(i => i.id !== t.id)" aria-label="Fechar">&times;</button>
      </div>
    </template>
  </div>
</div>

</body>
</html>
