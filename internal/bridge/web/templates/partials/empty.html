{{define "empty"}}
{{- /* usage: {{template "empty" (dict "Title" "..." "Body" "..." "CTAHref" "/..." "CTALabel" "...")}} */ -}}
<div class="empty-state">
  <svg class="empty-state__icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>
  </svg>
  <span class="empty-state__title">{{.Title}}</span>
  {{with .Body}}<span class="empty-state__body">{{.}}</span>{{end}}
  {{with .CTAHref}}
  <a href="{{.}}" class="btn btn-primary">{{or $.CTALabel "Criar agora"}}</a>
  {{end}}
</div>
{{end}}
