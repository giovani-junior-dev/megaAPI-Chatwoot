{{define "content"}}
{{with .Data}}
<section x-data="{saved: {{.Saved}}}" x-init="if (saved) setTimeout(() => saved = false, 4000)">
  <header class="section-header">
    <h1>Configurações</h1>
  </header>
  {{if .Saved}}
  <div class="toast-floating" x-show="saved" x-transition.opacity>
    <div class="toast toast-success" role="status" data-test="saved-toast">
      <span>Configurações salvas.</span>
    </div>
  </div>
  {{end}}
  <form method="post" action="/settings/base_url" class="space-y-3">
    <label class="block">
      <span class="field__label">Base URL pública do bridge</span>
      <input type="url" name="base_url" required value="{{.BaseURL}}"
             placeholder="https://bridge.exemplo.com"
             class="input">
      <span class="field__hint">Usado para registrar webhooks externos.</span>
    </label>
    <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
</section>
{{end}}
{{end}}
