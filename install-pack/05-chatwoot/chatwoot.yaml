version: "3.7"

###################################################################
# 05-chatwoot — Chatwoot self-hosted (admin + api + sidekiq + redis)
#
# Imagem: chatwoot/chatwoot:v4.14.1-ce
# Storage: LOCAL (ACTIVE_STORAGE_SERVICE=local) -> volume chatwoot_storage.
#          (sem Minio/S3 — anexos ficam no proprio servidor)
# Roteamento: Cloudflare Tunnel (SEM Traefik, SEM portas abertas).
#
# >> ANTES DE SUBIR, troque os placeholders MAIUSCULOS (ver .env.modelo):
#      SENHA_POSTGRES         senha do Postgres (mesma do 03-postgres)
#      CHAVE_SECRETA_64       SECRET_KEY_BASE  (openssl rand -hex 32)
#      DOMINIO                seu dominio raiz (ex.: minhaempresa.com.br)
#
# 1a subida: depois que os servicos estabilizarem, rode no console do
# container chatwoot_admin (pelo Portainer):
#      bundle exec rails db:chatwoot_prepare
#
# Subir:  docker stack deploy -c chatwoot.yaml chatwoot
###################################################################

services:
  chatwoot_admin:
    image: chatwoot/chatwoot:v4.14.1-ce
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    entrypoint: docker/entrypoints/rails.sh
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - network_swarm_public
    environment:
      - INSTALLATION_NAME=chatwoot
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      # >> TROQUE: openssl rand -hex 32
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # >> TROQUE DOMINIO (deve casar com o ingress da Cloudflare)
      - FRONTEND_URL=https://chat.${DOMINIO}
      - DEFAULT_LOCALE=pt-BR
      # HTTPS terminado no Cloudflare Tunnel -> FORCE_SSL desligado
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      - RAILS_LOG_TO_STDOUT=true
      - USE_INBOX_AVATAR_FOR_BOT=true
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      # >> TROQUE pela senha do .env.modelo (SENHA_POSTGRES)
      - POSTGRES_PASSWORD=${SENHA_POSTGRES}
      - POSTGRES_DATABASE=chatwoot
      # Storage LOCAL — anexos no volume chatwoot_storage (sem Minio/S3)
      - ACTIVE_STORAGE_SERVICE=local
      - SIDEKIQ_CONCURRENCY=10
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=5
      - CW_API_ONLY_SERVER=false
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M

  chatwoot_api:
    image: chatwoot/chatwoot:v4.14.1-ce
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    entrypoint: docker/entrypoints/rails.sh
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - network_swarm_public
    environment:
      - INSTALLATION_NAME=chatwoot
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=https://chat.${DOMINIO}
      - DEFAULT_LOCALE=pt-BR
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      - RAILS_LOG_TO_STDOUT=true
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SENHA_POSTGRES}
      - POSTGRES_DATABASE=chatwoot
      - ACTIVE_STORAGE_SERVICE=local
      - SIDEKIQ_CONCURRENCY=10
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=5
      # API-only: desliga a interface web neste servico
      - CW_API_ONLY_SERVER=true
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  chatwoot_sidekiq:
    image: chatwoot/chatwoot:v4.14.1-ce
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - network_swarm_public
    environment:
      - INSTALLATION_NAME=chatwoot
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=https://chat.${DOMINIO}
      - DEFAULT_LOCALE=pt-BR
      - FORCE_SSL=false
      - RAILS_LOG_TO_STDOUT=true
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SENHA_POSTGRES}
      - POSTGRES_DATABASE=chatwoot
      - ACTIVE_STORAGE_SERVICE=local
      - SIDEKIQ_CONCURRENCY=10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  chatwoot_storage:
  redis_data:

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
