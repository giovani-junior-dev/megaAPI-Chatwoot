version: "3.7"

# chatwoot-megaapi-bridge — Docker Swarm stack.
# Deploy:  docker stack deploy -c bridge.yaml bridge
# Secrets come from the shell environment (never commit real values):
#   MASTER_KEY, BRIDGE_ENCRYPTION_KEY, POSTGRES_PASSWORD, POSTGRES_ADMIN_URL
# On the very first deploy set POSTGRES_ADMIN_URL so the bridge creates its own
# role+database; remove it afterwards. RUN_MIGRATIONS=1 self-migrates on boot.

services:
  bridge:
    image: ghcr.io/madeinlowcode/chatwoot-megaapi-bridge:v1.1.0
    networks:
      - network_swarm_public
    environment:
      MASTER_KEY: ${MASTER_KEY}
      BRIDGE_ENCRYPTION_KEY: ${BRIDGE_ENCRYPTION_KEY}
      DATABASE_URL: postgres://bridge:${POSTGRES_PASSWORD}@postgres:5432/bridge
      POSTGRES_ADMIN_URL: ${POSTGRES_ADMIN_URL}
      RUN_MIGRATIONS: "1"
      BRIDGE_PORT: "8080"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  network_swarm_public:
    external: true
