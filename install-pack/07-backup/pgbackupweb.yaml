version: "3.7"

###################################################################
# 07-backup — pgbackweb: backups automaticos do Postgres.
#
# Faz dumps dos bancos `chatwoot` e `bridge` (e qualquer outro) com
# retencao configuravel. Roteamento via Cloudflare Tunnel se voce
# quiser acessar o painel (opcional) — SEM Traefik, SEM portas abertas.
#
# Retencao sugerida (configure DENTRO do painel pgbackweb, por job):
#   - diaria:   manter 14 dias
#   - semanal:  manter 4 semanas
#   - mensal:   manter 6 meses
#
# >> ANTES DE SUBIR, troque os placeholders MAIUSCULOS (ver .env.modelo):
#      PBW_ENCRYPTION_KEY_20   chave do pgbackweb (openssl rand -base64 16)
#      SENHA_POSTGRES          senha do superusuario postgres (03-postgres)
#
# O banco interno `pgbackweb` precisa existir no Postgres. Crie uma vez
# (console do container postgres, via Portainer):
#      psql -U postgres -c "CREATE DATABASE pgbackweb;"
#
# Subir:  docker stack deploy -c pgbackupweb.yaml pgbackupweb

services:
  pgbackupweb:
    image: eduardolat/pgbackweb:latest
    networks:
      - network_swarm_public
    volumes:
      - pgbackupweb_data:/backups
    environment:
      # >> TROQUE (openssl rand -base64 16)
      - PBW_ENCRYPTION_KEY=PBW_ENCRYPTION_KEY_20
      # >> TROQUE SENHA_POSTGRES pela senha do superusuario postgres
      - PBW_POSTGRES_CONN_STRING=postgresql://postgres:SENHA_POSTGRES@postgres:5432/pgbackweb?sslmode=disable
      - TZ=America/Sao_Paulo
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

volumes:
  pgbackupweb_data:

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
